services:
  linuxdo-monitor:
    build: .
    image: linuxdo-monitor:latest
    container_name: linuxdo-monitor
    restart: always
    environment:
      CONFIG_PATH: /config/config.json
      DB_PATH: /data/monitor.db
      LOG_DIR: /logs
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - ./data:/data
      - ./logs:/logs
    # 覆盖默认 CMD 可开启 Web 管理页：
    # command: ["linuxdo-monitor", "run", "--config", "/config/config.json", "--web-port", "8080"]
